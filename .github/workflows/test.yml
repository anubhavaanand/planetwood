name: Cross-Browser E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Run against all three browsers defined in playwright.config.ts
        browser: [chromium, firefox, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start WebSocket relay server
        run: cd server && nohup node index.js > relay.log 2>&1 &

      - name: Wait for relay to be ready
        run: sleep 3 && nc -z localhost 3005

      - name: Run E2E tests (${{ matrix.browser }})
        env:
          CI: true
        run: npx playwright test --project ${{ matrix.browser }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Optional: also run a lint/typecheck step before tests
  typecheck:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck test files
        run: npx tsc --noEmit tests/e2e/planetwood.spec.ts playwright.config.ts || true
